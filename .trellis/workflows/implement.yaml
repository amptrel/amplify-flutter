# Implement a triaged bug on the pilot fork amptrel/amplify-flutter as a fast follow-up. When an open issue carries
# both `bug` (the triage sets it) and `ready-to-implement` (varshpam adds it), a Strands agent makes a small change
# and PROPOSES the branch, the commit and a draft pull request on the fork. A person approves them at the gate
# approve_pr; open_pr then performs them. No build, no tests.
# Port of alvazjor/aws-cdk trellis-demo .trellis/workflows/implement.yaml (2026-10-28) to the current loader
# (schemaVersion added; workflow.input is workflow.in in ${} and workflow['in'] in CEL; ${step.x.y} is
# ${steps.x.out.y}; the gate's approved list is ${steps.approve_pr.decision.approved}).
#
# Trellis acts as the GitHub App amptrel[bot] (github.self_logins in the instance config). The triage sets `bug` as
# amptrel[bot], so that `labeled` event is self-caused: on.self_events accepts it, in case `bug` lands second.
# routing.user_filter passes only VarshithaPamisetty, so ignore_global_filter is set and the filter below names
# both actors. This workflow adds no label, so it cannot start itself. The implementer writes only by proposal:
# every GitHub write tool it has is in allowed_proposals. An installation token has no user identity: nothing
# here asks GitHub who it is. Disabled until the pilot turns it on.
schemaVersion: 1
version: 1
enabled: false
description: Implement an open issue labeled both bug and ready-to-implement, in either order, and open a draft PR on the fork after approval at a gate. No build, no tests.

on:
  platform: github
  entity: issue
  action: labeled
  # Starts when the second of the two labels is added, by varshpam or by the triage (amptrel[bot]):
  # the issue is open, has both labels, the label just added is one of them, and the actor is one of the two.
  filter: >-
    workflow['in'].data.state == 'open'
    && 'bug' in workflow['in'].data.labels
    && 'ready-to-implement' in workflow['in'].data.labels
    && workflow['in'].raw.label.name in ['bug', 'ready-to-implement']
    && workflow['in'].actor in ['VarshithaPamisetty', 'amptrel[bot]']
  self_events: [issue]                 # the triage sets `bug` as amptrel[bot], Trellis's own login
  ignore_global_filter: true           # routing.user_filter passes only VarshithaPamisetty; the filter above also allows amptrel[bot]
  concurrency:
    group: implement-${workflow.in.subject.number}
    policy: cancel-outdated            # both labels added at once: the later event's run replaces the earlier one

steps:
  - id: implement
    kind: agent
    agent: strands/implementer
    instruction: |
      Implement the issue in your inputs and open a draft pull request, as your agent instructions
      describe: propose the branch, the commit and the draft pull request, then submit branch, title
      and summary.
    in:
      owner: amptrel
      repo: amplify-flutter
      number: ${workflow.in.subject.number}
      title: ${workflow.in.data.title}
      url: ${workflow.in.subject.url}
      branch: trellis/implement-issue-${workflow.in.subject.number}
    allowed_proposals:                 # <server>_<tool> for strands; saved for the gate, not run
      - github_create_branch
      - github_push_files
      - github_create_pull_request
    out:
      branch: string
      title: string
      summary: string

  # The person sees the proposed branch, commit (every changed file) and pull request here, and
  # approves or rejects in the Trellis UI. A reject ends the run and nothing is written.
  - id: approve_pr
    kind: gate
    depends_on: [implement]
    in:
      issue: ${workflow.in.subject.url}
      title: ${steps.implement.out.title}
      branch: ${steps.implement.out.branch}
      summary: ${steps.implement.out.summary}
      proposals: ${steps.implement.proposals}
    out:
      outcome: enum[approve, reject]
      feedback: string

  # Performs what the gate approved, in order: the branch, the commit, the draft pull request.
  - id: open_pr
    kind: deterministic
    depends_on: [approve_pr]
    in:
      proposals: ${steps.approve_pr.decision.approved}
    run:
      - ${in.proposals}
